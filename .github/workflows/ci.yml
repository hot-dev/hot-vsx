name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Package extension
        run: |
          mkdir -p build
          npx --yes @vscode/vsce@3.9.2 package --no-yarn --out build/
