name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Keeps npm's dependencies away from the publish job's store credentials.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: npm ci

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run lint

      - run: npm test

      - name: Package extension
        run: |
          mkdir -p build
          npx --yes @vscode/vsce@4.1.0 package --no-yarn --out build/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: build/*.vsix
          if-no-files-found: error

  # Every step here is safe to repeat, so "Re-run failed jobs" finishes a partial
  # release with the same .vsix.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: build

      - name: Create release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.vsix --generate-notes
          fi

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath build/*.vsix

      # Uses OVSX_PAT if it's set, and the repository's trusted publisher if not.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish build/*.vsix --skip-duplicate
